spring.application.name=AnyView

# MySQL数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/zjsy?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.springbootmybatis.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Mapper扫描路径
mybatis.mapper-packages=com.example.springbootmybatis.mapper
